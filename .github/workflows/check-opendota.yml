name: Observe OpenDota for 24 hours
on:
  push:
    branches: [codex/check-opendota]
jobs:
  observe:
    runs-on: [self-hosted, x260, linux]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install bounded observation on server
        run: |
          set -eu
          command -v crontab
          systemctl is-active cron
          python3 - <<'PY'
          import json,os,pathlib,shutil,subprocess,time
          root=pathlib.Path.home()/'.local/share/pesiki-opendota-observation'
          root.mkdir(parents=True,exist_ok=True)
          os.chmod(root,0o700)
          script=root/'observe.py'
          shutil.copyfile('tools/observe-opendota.py',script)
          config=root/'config.json'
          if not config.exists():
              start=int(time.time())
              config.write_text(json.dumps({'start':start,'end':start+86400}))
          old=subprocess.run(['crontab','-l'],capture_output=True,text=True)
          if old.returncode not in (0,1):raise RuntimeError('Cannot read crontab')
          marker='# pesiki-opendota-observation-24h'
          lines=[line for line in old.stdout.splitlines() if marker not in line]
          import shlex
          lines.append('*/10 * * * * /usr/bin/flock -n '+shlex.quote(str(root/'lock'))+' /usr/bin/python3 '+shlex.quote(str(script))+' '+shlex.quote(str(root))+' >> '+shlex.quote(str(root/'monitor.log'))+' 2>&1 '+marker)
          subprocess.run(['crontab','-'],input='\n'.join(lines)+'\n',text=True,check=True)
          subprocess.run(['/usr/bin/python3',str(script),str(root)],check=True)
          print('Report directory:',root)
          print((root/'summary.json').read_text())
          PY
