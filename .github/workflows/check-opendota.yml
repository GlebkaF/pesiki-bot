name: Read OpenDota observation report
on:
  push:
    branches: [codex/check-opendota]
jobs:
  report:
    runs-on: [self-hosted, x260, linux]
    timeout-minutes: 3
    steps:
      - name: Read saved report and monitoring schedule
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,datetime
          root=pathlib.Path.home()/'.local/share/pesiki-opendota-observation'
          print((root/'summary.json').read_text())
          samples=[json.loads(s) for s in (root/'samples.jsonl').read_text().splitlines()]
          print('first_sample',samples[0]['at'],'last_sample',samples[-1]['at'])
          gaps=[(datetime.datetime.fromisoformat(b['at'])-datetime.datetime.fromisoformat(a['at'])).total_seconds() for a,b in zip(samples,samples[1:])]
          print('max_sample_gap_seconds',max(gaps,default=0))
          last={}
          for s in samples:
              counts=s.get('counts',{})
              if s.get('error') or any(counts.get(k,0)>last.get(k,0) for k in ['rate_limits','network_failures','feed_failures']):print('incident',json.dumps(s))
              last=counts
          cron=subprocess.run(['crontab','-l'],capture_output=True,text=True)
          print('monitor_scheduled', '# pesiki-opendota-observation-24h' in cron.stdout)
          log=root/'monitor.log'
          print('monitor_log_bytes',log.stat().st_size if log.exists() else 0)
          PY
